{% extends 'base.html' %}

{% block title %}새 작업{% endblock %}

{% block content %}
<div class="container">
    <h1>새 작업 생성</h1>
    <form method="post">
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">설명</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="priority" class="form-label">우선순위</label>
            <select class="form-select" id="priority" name="priority" required>
                <option value="LOW">낮음</option>
                <option value="MEDIUM" selected>보통</option>
                <option value="HIGH">높음</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="due_date" class="form-label">마감일</label>
            <input type="date" class="form-control" id="due_date" name="due_date">
        </div>
        <button type="submit" class="btn btn-primary">작업 생성</button>
        <a href="{{ url_for('todo.index') }}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
